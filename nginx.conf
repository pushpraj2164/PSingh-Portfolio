# Nginx Configuration with Brotli & Gzip Pre-Compression Support
# Place in /etc/nginx/conf.d/portfolio.conf or include in your server block

server {
    listen 80;
    server_name pushprajsinghbhati.dev www.pushprajsinghbhati.dev;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pushprajsinghbhati.dev www.pushprajsinghbhati.dev;

    # SSL certificates (configured via Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/pushprajsinghbhati.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pushprajsinghbhati.dev/privkey.pem;

    root /var/www/portfolio/browser;
    index index.html;

    # 1. BROTLI PRE-COMPRESSED STATIC ASSETS
    # Requires ngx_brotli module (standard on modern Linux distributions)
    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # 2. GZIP PRE-COMPRESSED STATIC ASSETS
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # 3. HIGH-PERFORMANCE STATIC CACHING HEADERS
    # Immutable cache for version-hashed assets and WebP images (1 year)
    location ~* \.(?:css|js|webp|woff2?|ttf|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # 4. SEO & AI DISCOVERY ENDPOINTS
    location ~* /(?:robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 5. SPA HTML ROUTING FALLBACK
    # Ensure index.html is revalidated so users immediately get app updates
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

